const express = require('express');
const http = require('http');
const { Server } = require('socket.io');

const app = express();
const server = http.createServer(app);
const io = new Server(server, { cors: { origin: '*' } });

const PAGE = String.raw`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Arena</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;font-family:sans-serif}
canvas{width:100%;height:100%;display:block}
#hit{position:fixed;right:30px;bottom:40px;width:90px;height:90px;border-radius:50%;background:#e33;color:#fff;border:0;font-size:18px;opacity:.85}
#joy{position:fixed;left:30px;bottom:40px;width:120px;height:120px;border-radius:50%;background:#ffffff22}
#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff88}
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<div id="joy"><div id="stick"></div></div>
<button id="hit">DABZ</button>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let players = {}, dir = { dx: 0, dy: 0 };
const nm = prompt('Smitek?') || '';
if (nm) socket.emit('name', nm);
socket.on('state', (p) => players = p);

const joy = document.getElementById('joy'), stick = document.getElementById('stick');
function joyMove(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = joy.getBoundingClientRect();
  let x = t.clientX - (r.left + r.width / 2), y = t.clientY - (r.top + r.height / 2);
  const m = Math.hypot(x, y), max = 50;
  if (m > max) { x = x / m * max; y = y / m * max; }
  stick.style.left = 40 + x + 'px'; stick.style.top = 40 + y + 'px';
  dir = { dx: x / max, dy: y / max };
}
function joyEnd() { dir = { dx: 0, dy: 0 }; stick.style.left = '40px'; stick.style.top = '40px'; }
joy.addEventListener('touchstart', joyMove);
joy.addEventListener('touchmove', (e) => { e.preventDefault(); joyMove(e); }, { passive: false });
joy.addEventListener('touchend', joyEnd);

const hit = document.getElementById('hit');
hit.addEventListener('touchstart', (e) => { e.preventDefault(); socket.emit('hit'); });
hit.addEventListener('click', () => socket.emit('hit'));

const keys = {};
onkeydown = (e) => { keys[e.key] = true; if (e.code === 'Space') socket.emit('hit'); };
onkeyup = (e) => keys[e.key] = false;

setInterval(() => {
  let dx = dir.dx, dy = dir.dy;
  if (keys.ArrowLeft || keys.a) dx = -1;
  if (keys.ArrowRight || keys.d) dx = 1;
  if (keys.ArrowUp || keys.w) dy = -1;
  if (keys.ArrowDown || keys.s) dy = 1;
  if (dx || dy) socket.emit('move', { dx, dy });
}, 50);

function draw() {
  ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 800, 500);
  for (const id in players) {
    const p = players[id];
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7); ctx.fill();
    if (id === socket.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#400'; ctx.fillRect(p.x - 25, p.y - 32, 50, 6);
    ctx.fillStyle = '#4e4'; ctx.fillRect(p.x - 25, p.y - 32, 50 * p.hp / 100, 6);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.name + ' (' + p.score + ')', p.x, p.y - 38);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>`;

app.get('/', (req, res) => res.send(PAGE));

const W = 800, H = 500;
const players = {};
const rnd = (n) => Math.random() * n;

io.on('connection', (s) => {
  players[s.id] = {
    id: s.id, x: rnd(W), y: rnd(H), hp: 100, score: 0,
    color: 'hsl(' + Math.floor(rnd(360)) + ',80%,55%)',
    name: 'P' + s.id.slice(0, 3)
  };

  s.on('name', (n) => { if (players[s.id]) players[s.id].name = String(n).slice(0, 12); });

  s.on('move', (d) => {
    const p = players[s.id]; if (!p) return;
    const dx = Math.max(-1, Math.min(1, +d.dx || 0));
    const dy = Math.max(-1, Math.min(1, +d.dy || 0));
    p.x = Math.max(0, Math.min(W, p.x + dx * 6));
    p.y = Math.max(0, Math.min(H, p.y + dy * 6));
  });

  s.on('hit', () => {
    const p = players[s.id]; if (!p) return;
    for (const id in players) {
      if (id === s.id) continue;
      const q = players[id];
      if (Math.hypot(p.x - q.x, p.y - q.y) < 55) {
        q.hp -= 15;
        if (q.hp <= 0) { p.score++; q.hp = 100; q.x = rnd(W); q.y = rnd(H); }
      }
    }
  });

  s.on('disconnect', () => delete players[s.id]);
});

setInterval(() => io.emit('state', players), 50);
server.listen(process.env.PORT || 3000, () => console.log('Server ready'));
